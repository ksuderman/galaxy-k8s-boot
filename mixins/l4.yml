# GalaxyAI configuration for the self-hosted L4 GPU backend (ai_backend=ollama-gpu
# with --gpu-type l4): Ollama running mistral-small:24b on an NVIDIA L4 behind LiteLLM.
# The dev image is required for the latest GalaxyAI.
image:
  repository: quay.io/galaxyproject/galaxy-min
  tag: "dev"

# Unlike the CPU 3b, the mistral-small:24b on the L4 does the GalaxyAI agents'
# structured/tool-call output NATIVELY -- so the mixins/cpu.yml band-aids
# (structured_output_override, disabling custom_tool) are intentionally NOT used
# here: they break real tool-calling (the history/graph agent fails with
# "Seed hda:... not found in graph") without fixing anything.
#
# The runaway over-generation seen during bring-up (router/history agents burning
# 2.7k-3.2k+ tokens per call, minutes at ~24 tok/s, UI unresponsive) was NOT a
# model-capability problem: it was Ollama's default 4096 context window overflowing
# on the ~2-4k-token agent prompts, forcing a mid-generation context shift that
# discarded half the prompt and made the model loop. The fix is the larger context
# window -- ollama_context_length: 16384 in the role defaults (OLLAMA_CONTEXT_LENGTH
# on the Ollama deployment) -- NOT any agent-output tuning. Verified: with 16k
# context and structured output ON, a real query routed + ran tool-using agents to a
# 200 answer in ~36s.
#
# The runtime ai_api_base_url / ai_model / ai_api_key are injected by the
# playbook (they depend on the in-cluster LiteLLM service + generated key), so
# this mixin only carries the static agent tuning.
configs:
  galaxy.yml:
    galaxy:
      logo_url: null
      brand: Ollama-L4
      inference_services:
        default:
          # Fail fast on the rare doomed request rather than burning the full retry
          # budget; structured output normally succeeds first try on the 24b.
          retries: 1

extraFileMappings:
  /galaxy/server/static/welcome.html:
    applyToWeb: true
    applyToNginx: true
    content: |
      <!DOCTYPE html>
      <html lang="en">
          <head>
              <meta charset="utf-8" />
              <link rel="stylesheet" href="dist/base.css" type="text/css" />
          </head>
          <body class="m-0">
              <div class="py-4">
                  <div class="container">
                      <div class="row mb-4">
                          <div class="col-md-12">
                              <h2>Welcome to Galaxy</h2>
                              <p>
                                  Galaxy is an interactive and workflow analysis
                                  platform providing a graphical user interface
                                  for computational tools. This is your own
                                  Galaxy instance that you can customize and use
                                  for your own research.
                              </p>
                              <h2>GalaxyAI</h2>
                              <p>
                                This Galaxy instance has been configured to route
                                GalaxyAI to a self-hosted Ollama on an NVIDIA L4
                                GPU behind LiteLLM, running mistral-small:24b.
                              </p>
                          </div>
                      </div>
                  </div>
              </div>
          </body>
      </html>
