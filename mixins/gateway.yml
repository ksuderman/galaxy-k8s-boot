# Use the Gateway API with Istio instead of Ingress
image:
  repository: ksuderman/galaxy-min
  tag: "26.1.dev2"

configs:
  galaxy.yml:
    galaxy:
      brand: Gateway API
gateway:
  enabled: true
  gatewayClassName: istio
  istio:
    timeout: "600s"
    maxRequestHeadersKb: 96
    streamIdleTimeout: "600s"

ingress:
  enabled: false
