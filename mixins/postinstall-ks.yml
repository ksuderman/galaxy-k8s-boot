postInstallJob:
  enabled: true
  image: quay.io/galaxyproject/abm:2.14.0
  galaxyUser: "default-user@galaxyproject.org"
  bootstrapConfig: |
    workflows:
      - "https://benchmarking-inputs.s3.amazonaws.com/Variant/Galaxy-Workflow-Variant_analysis_on_WGS_PE_data.ga"
      - "https://benchmarking-inputs.s3.us-east-1.amazonaws.com/ILLung/Galaxy-Workflow-IL_Lung.ga"
    histories:
      - url: "https://benchmarking-inputs.s3.amazonaws.com/Variant/Variant-calling-inputs---2GB.rocrate.zip"
        name: "Variant 2G"
      - url: "https://benchmarking-inputs.s3.amazonaws.com/ERR3485802/Galaxy-History-VC-Test-Data.tar.gz"
        name: "Variant Test"
      - url: "https://benchmarking-inputs.s3.us-east-1.amazonaws.com/ILLung/ILLungyoungvsold.tar.gz"
        name: "Lung Data"
