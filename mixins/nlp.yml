configs:
  galaxy.yml:
    galaxy:
      brand: NLP
      admin_users: suderman@jhu.edu,schneidd@informatik.uni-freiburg.de
      logo_url: null
      logo_src: null
      logo_src_secondary: null
jobs:
  rules:
    tpv_rules_local.yml:
      destinations:
        gcp_batch:
          params:
            job_id_prefix: galaxy-nlp
      tools:
        toolshed.g2.bx.psu.edu/repos/ksuderman/spacy_nlp/spacy_nlp/.*:
          cores: 2
          mem: 8
          rules:
            - id: spacy_heavy
              if: |
                param_dict = job.get_param_values(app)
                param_dict.get('annotators', '') in ('parse',)
              cores: 4
              mem: 16
        testtoolshed.g2.bx.psu.edu/repos/ksuderman/stanza_nlp/stanza_nlp/.*:
          cores: 2
          mem: 8
          rules:
            - id: stanza_heavy
              if: |
                param_dict = job.get_param_values(app)
                param_dict.get('annotators', '') in ('parse', 'sentiment', 'constituency')
              cores: 4
              mem: 16
        testtoolshed.g2.bx.psu.edu/repos/ksuderman/stanford_corenlp/stanford_corenlp/.*:
          cores: 2
          mem: 8
          rules:
            - id: corenlp_heavy_test
              if: |
                param_dict = job.get_param_values(app)
                param_dict.get('annotators', '') in ('parse', 'coref', 'sentiment')
              cores: 4
              mem: 16
        toolshed.g2.bx.psu.edu/repos/ksuderman/stanford_corenlp/stanford_corenlp/.*:
          cores: 2
          mem: 8
          rules:
            - id: corenlp_heavy
              if: |
                param_dict = job.get_param_values(app)
                param_dict.get('annotators', '') in ('parse', 'coref', 'sentiment')
              cores: 4
              mem: 16
extraFileMappings:
  /galaxy/server/static/welcome.html:
    applyToWeb: true
    applyToNginx: true
    content: |
      <!DOCTYPE html>
      <html lang="en">
          <head>
              <meta charset="utf-8" />
              <link rel="stylesheet" href="dist/base.css" type="text/css" />
          </head>
          <body class="m-0">
              <div class="py-4">
                  <div class="container">
                      <div class="row mb-4">
                          <div class="col-md-12">
                              <h2>Welcome to Galaxy NLP</h2>
                              <p>
                                  This Galaxy instance provides natural language processing (NLP) tools
                                  for text annotation and analysis. Available tools include:
                              </p>
                              <ul>
                                  <li><strong>Stanford CoreNLP</strong> &mdash; tokenization, part-of-speech tagging,
                                      named entity recognition, dependency parsing, coreference resolution,
                                      and sentiment analysis for 8 languages</li>
                                  <li><strong>spaCy</strong> &mdash; fast, industrial-strength NLP with tokenization,
                                      POS tagging, NER, and dependency parsing for 25+ languages</li>
                              </ul>
                              <p>
                                  To get started, upload a plain text file and select an NLP tool from
                                  the tool panel on the left. Language models can be installed by an
                                  administrator via <em>Admin &rarr; Local Data</em>.
                              </p>
                          </div>
                      </div>
                  </div>
              </div>
          </body>
      </html>
