
image:
  repository: quay.io/galaxyproject/galaxy-min
  tag: "26.0"

ingress:
  enabled: true
  ingressClassName: ""
  canary:
    enabled: false
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
  - host: ~
    paths:
    - path: /
  path: /

persistence:
  storageClass: nfs

cvmfs:
  deploy: false
  deployPostInstallFix: true
  cvmfscsi:
    cache:
      local:
        enabled: true
        pvc:
          storageClass: nfs
          name: cvmfs-local-cache
      alien:
        enabled: false
        pvc:
          name: cvmfs-alien-cache
    logVerbosityLevel: 5

postgresql:
  persistence:
    storageClass: postgres-storage

rabbitmq:
  persistence:
    storageClassName: blockstorage

configs:
  galaxy.yml:
    galaxy:
      enable_beta_gdpr: true
      tus_upload_store: /galaxy/server/database/tmp/tus_upload_store
      # The URL linked by the "Galaxy/brand" text
      logo_url: https://anvil.terra.bio/#workspaces
      # The brand image source
      logo_src: /static/images/galaxy-project-logo-white-square.png
      # The custom brand image source
      logo_src_secondary: /static/images/anvil-project-logo-white.png
      enable_quotas: true
      single_user: default-user@galaxyproject.org
      admin_users: default-user@galaxyproject.org
  job_conf.yml:
    runners:
      gcp_batch:
        load: galaxy.jobs.runners.gcp_batch:GoogleCloudBatchJobRunner
        workers: 4
        # Basic GCP settings
        project_id: anvil-and-terra-development
        region: us-east4
        service_account_email: galaxy-batch-runner@anvil-and-terra-development.iam.gserviceaccount.com

        # Network configuration (required for NFS access)
        network: default
        subnet: default

        # Compute resources (defaults shown)
        machine_type: n2-standard-4
        vcpu: 1.0
        memory_mib: 2048
        boot_disk_size_gb: 100
        boot_disk_type: pd-standard

        # Container settings
        use_container: true
        # Note: container_image comes from tool requirements via Galaxy's container finder
        galaxy_user_id: 10001
        galaxy_group_id: 10001
        docker_extra_volumes: "/cvmfs/data.galaxyproject.org:/cvmfs/data.galaxyproject.org:ro,/cvmfs/cloud.galaxyproject.org:/cvmfs/cloud.galaxyproject.org:ro"

        # Custom VM image with CVMFS pre-configured (update date as needed)
        custom_vm_image: projects/anvil-and-terra-development/global/images/galaxy-k8s-boot-debian12-v2026-02-24
        # Job execution settings
        max_retry_count: 3
        # Max time a job will run before being deleted. Must be in seconds (end with 's'). Default 24hrs.
        max_run_duration: 86400s
        polling_interval: 30
        # delete_completed_jobs: true # Not available until 26.1 (is in v26.1-auto images)
      local:
        load: galaxy.jobs.runners.local:LocalJobRunner
        workers: 3
    execution:
      default: tpv_dispatcher
      environments:
        local:
          runner: local
        gcp_batch:
          runner: gcp_batch
        # Interactive Tools run as pods on THIS RKE2 cluster via the KubernetesJobRunner
        # (the k8s runner + its k8s_interactivetools_* ingress params come from the Galaxy
        # Helm chart). ITs must never go to GCP Batch. NOTE: in this deployment TPV (the
        # tpv_dispatcher default) actually resolves IT destinations to its own `k8s`
        # destination -- the static interactive_tool.* -> k8s mapping below is documented
        # intent, and the IT-specific run-as-user override lives in the TPV rules (see the
        # interactive_tool_.* rule in tpv_rules_local.yml).
        k8s:
          runner: k8s
    destinations:
      - id: gcp_batch_default
        runner: gcp_batch
      - id: k8s_default
        runner: k8s
      - id: local_default
        runner: local
    tools:
      - environment: local
        id: upload1
      - environment: local
        id: __DATA_FETCH__
      - environment: local
        id: __EXPORT_HISTORY__
      - environment: local
        id: __IMPORT_HISTORY__
      - environment: local
        id: __SET_METADATA__
      - environment: local
        id: __EXTRACT_DATASET__
      # Route interactive tools to Kubernetes (local RKE2 cluster), never GCP Batch.
      - environment: k8s
        id: interactive_tool.*
      # Route data source tools to Kubernetes
      - environment: local
        id: .*data_source.*
      # Keep workflows internal to cluster
      - environment: local
        id: __EXPORT_WORKFLOW__
      - environment: local
        id: __IMPORT_WORKFLOW__
      - environment: local
        id: random_lines1
      # Expression/param tools must run locally — TPV additive tag merge
      # with the global DB causes reject:[local] to persist even when
      # overridden, so route them here before TPV is consulted.
      - environment: local
        id: compose_text_param
      - environment: local
        id: map_param_value
      - environment: local
        id: param_value_from_file
      - environment: local
        id: tp_awk_tool
      - environment: local
        id: tp_grep_tool
    limits:
      - type: total_walltime
        window: 1  # number in days
        value: '96:00:00'  # total walltime in HH:MM:SS that all jobs cannot exceed or add'l jobs won't run

jobs:
   rules:
    tpv_rules_local.yml:
      destinations:
        k8s:
          max_accepted_cores: 1
          max_accepted_mem: 4
          scheduling:
            prefer:
              - small-job
        gcp_batch:
          runner: gcp_batch
          params:
            docker_enabled: "true"
            cores: "{cores}"
            mem: "{mem}"
            job_id_prefix: galaxy-batch
      tools:
        default:
          scheduling:
            prefer:
              - small-job
          rules:
            - id: force_default_container_for_built_in_tools
              if: |
                from galaxy.tools import GALAXY_LIB_TOOLS_UNVERSIONED
                tool.id in GALAXY_LIB_TOOLS_UNVERSIONED or "CONVERTER_" == tool.id[:10] or tool.is_datatype_converter
              params:
                docker_container_id_override: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        # Interactive Tools run foreign images (e.g. Jupyter's `jovyan`, uid 1000, with a
        # writable /home/jovyan), not Galaxy's uid-10001 job image. TPV -- not the static
        # tools: map in job_conf -- resolves IT destinations (to the k8s destination), so
        # the run-as-user override must live here. Clearing these params makes the k8s
        # runner omit the pod securityContext, so each IT image runs as its own Dockerfile
        # USER (empty string -> runner resolves to None -> runAsUser/fsGroup/etc omitted).
        # Without this, IT pods run as uid 10001 and fail to write their own home dir.
        interactive_tool_.*:
          params:
            k8s_run_as_user_id: ''
            k8s_run_as_group_id: ''
            k8s_supplemental_group_id: ''
            k8s_fs_group_id: ''

extraVolumes:
  - name: static-images
    configMap:
      name: galaxy-static-images

extraVolumeMounts:
  - name: static-images
    mountPath: /galaxy/server/static/images
    readOnly: true

extraFileMappings:
  /galaxy/server/static/welcome.html:
    applyToWeb: true
    applyToNginx: true
    content: |
      <!DOCTYPE html>
      <html lang="en">
          <head>
              <meta charset="utf-8" />
              <link rel="stylesheet" href="dist/base.css" type="text/css" />
          </head>
          <body class="m-0">
              <div class="py-4">
                  <div class="container">
                      <div class="row mb-4">
                          <div class="col-md-12">
                              <h2>Welcome to Galaxy</h2>
                              <p>
                                  Galaxy is an interactive and workflow analysis
                                  platform providing a graphical user interface
                                  for computational tools. This is your own
                                  Galaxy instance that you can customize and use
                                  for your own research.
                              </p>
                          </div>
                      </div>
                  </div>
              </div>
          </body>
      </html>
