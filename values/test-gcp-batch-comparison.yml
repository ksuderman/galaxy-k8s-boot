# Performance Test Configuration for GCP Batch Runner Comparison
#
# This configuration routes specific tools to each runner for A/B testing:
#   - Cut1, Grep1, Sort1 -> Direct GCP Batch (NFS-based)
#   - FastQC, BWA, Samtools -> Pulsar GCP Batch (SSD-based)
#
# Usage:
#   bin/launch_vm.sh test-galaxy-vm \
#     --git-branch persistent-data-merged \
#     -f values/hybrid-gcp-batch.yml \
#     -f values/test-gcp-batch-comparison.yml
#
# Or add to existing cluster:
#   helm upgrade galaxy ksuderman/galaxy -n galaxy \
#     --reuse-values \
#     -f values/test-gcp-batch-comparison.yml

configs:
  job_conf.yml:
    execution:
      # Use TPV dispatcher for flexible tool routing
      default: tpv_dispatcher
      environments:
        local:
          runner: local
        gcp_batch:
          runner: gcp_batch
          container_image: ubuntu:22.04
          machine_type: e2-standard-4
        pulsar_gcp:
          runner: pulsar_gcp
          machine_type: e2-standard-4

    # =========================================================================
    # Test Tool Routing Configuration
    # =========================================================================
    # Tools are categorized by their I/O patterns to test each runner's strengths:
    #
    # Group A (Direct GCP Batch / NFS):
    #   - Text processing tools with streaming I/O
    #   - Benefits from direct NFS access without transfer overhead
    #
    # Group B (Pulsar GCP Batch / SSD):
    #   - Tools with heavy random I/O
    #   - Benefits from local SSD speed
    # =========================================================================
    tools:
      # System tools - always local
      - environment: local
        id: upload1
      - environment: local
        id: __DATA_FETCH__
      - environment: local
        id: __EXPORT_HISTORY__
      - environment: local
        id: __IMPORT_HISTORY__
      - environment: local
        id: __SET_METADATA__
      - environment: local
        id: __EXTRACT_DATASET__
      - environment: local
        id: interactive_tool.*
      - environment: local
        id: .*data_source.*
      - environment: local
        id: __EXPORT_WORKFLOW__
      - environment: local
        id: __IMPORT_WORKFLOW__

      # =========================================================================
      # GROUP A: Direct GCP Batch (NFS-based)
      # Test streaming/sequential I/O performance
      # =========================================================================
      - environment: gcp_batch
        id: Cut1
      - environment: gcp_batch
        id: Grep1
      - environment: gcp_batch
        id: Sort1
      - environment: gcp_batch
        id: Paste1
      - environment: gcp_batch
        id: join1
      - environment: gcp_batch
        id: cat1
      - environment: gcp_batch
        id: toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/.*

      # =========================================================================
      # GROUP B: Pulsar GCP Batch (SSD-based)
      # Test random I/O intensive tools
      # =========================================================================
      - environment: pulsar_gcp
        id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/.*
      - environment: pulsar_gcp
        id: toolshed.g2.bx.psu.edu/repos/devteam/bwa/bwa/.*
      - environment: pulsar_gcp
        id: toolshed.g2.bx.psu.edu/repos/devteam/bwa/bwa_mem/.*
      - environment: pulsar_gcp
        id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_.*
      - environment: pulsar_gcp
        id: toolshed.g2.bx.psu.edu/repos/iuc/hisat2/hisat2/.*
      - environment: pulsar_gcp
        id: toolshed.g2.bx.psu.edu/repos/iuc/featurecounts/featurecounts/.*

# TPV Rules for resource-based routing
jobs:
  rules:
    tpv_rules_local.yml:
      # =========================================================================
      # Performance Test Destinations
      # =========================================================================
      destinations:
        # Direct GCP Batch destination
        gcp_batch:
          runner: gcp_batch
          scheduling:
            accept:
              - gcp-batch
          params:
            docker_enabled: "true"
            # Pass TPV-computed cores/mem to the runner for dynamic VM sizing
            cores: '{cores}'
            mem: '{mem}'

        # Pulsar GCP Batch destination
        pulsar_gcp:
          runner: pulsar_gcp
          scheduling:
            accept:
              - pulsar-gcp
          params:
            docker_enabled: "true"
            # Pass TPV-computed cores/mem to the runner for dynamic VM sizing
            cores: '{cores}'
            mem: '{mem}'

        # Kubernetes destination
        k8s:
          runner: k8s
          max_cores: 1
          max_mem: 4
          scheduling:
            accept:
              - k8s
          params:
            docker_enabled: "true"
            limits_memory: '{mem}Gi'
            requests_cpu: '{cores}'
            requests_memory: '{mem}Gi'

      # =========================================================================
      # Tool-specific resource requirements for testing
      # =========================================================================
      tools:
        # Text processing - lightweight, routed to gcp_batch
        Cut1:
          cores: 1
          mem: 2
          scheduling:
            prefer:
              - gcp-batch
          env:
            TEST_RUNNER: "direct_gcp_batch"

        Grep1:
          cores: 1
          mem: 2
          scheduling:
            prefer:
              - gcp-batch
          env:
            TEST_RUNNER: "direct_gcp_batch"

        Sort1:
          cores: 2
          mem: 4
          scheduling:
            prefer:
              - gcp-batch
          env:
            TEST_RUNNER: "direct_gcp_batch"

        # Bioinformatics - routed to pulsar_gcp
        # No hardcoded cores/mem - allows user resource_parameters to control VM sizing
        toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/.*:
          scheduling:
            prefer:
              - pulsar-gcp
          env:
            TEST_RUNNER: "pulsar_gcp_batch"

        toolshed.g2.bx.psu.edu/repos/devteam/bwa/bwa_mem/.*:
          cores: 4
          mem: 8
          scheduling:
            prefer:
              - pulsar-gcp
          env:
            TEST_RUNNER: "pulsar_gcp_batch"

        toolshed.g2.bx.psu.edu/repos/iuc/samtools_.*/.*:
          cores: 2
          mem: 4
          scheduling:
            prefer:
              - pulsar-gcp
          env:
            TEST_RUNNER: "pulsar_gcp_batch"
